[project]
name = "regulatory-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.141.1",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "passlib[bcrypt]>=1.7.4",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.14.0",
    "pymongo>=4.18.1",
    "redis>=8.1.0",
    "sentence-transformers>=6.0.1",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
regulatory-rag = "regulatory_rag:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = ["app", "services", "shared"]

[tool.pytest.ini_options]
testpaths = ["test"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[tool.ruff]
extend-exclude = ["migrations/versions"]
# line-length = 110 -> Max characters per line
line-length = 110

[tool.ruff.lint]
# E -> PEP8 style errors
# F -> Real bugs: unused imports, undefined names
# I -> sort imports automatically 
# UP -> Upgrades old syntax (List[int] -> list[int], PEP585) 
# B -> Comman bug patterns, like def f(x=[])

select = ["E", "F", "I", "UP", "B"]


[tool.mypy]
plugins = ["pydantic.mypy"]   #Teaches mypy how pydantic models work
ignore_missing_imports = true  #Don't fail on libraries that ship without type hints
disallow_untyped_defs = true #Every function must have type hints
